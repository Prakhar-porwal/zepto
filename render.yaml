services:
  - type: web
    name: tracker
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # paste the one-line Instamart session when Render asks (kept secret, never in git)
      - key: INSTAMART_PROFILES_JSON
        sync: false
